<section class="trust-badges" style="background-color: {{ module.style_fields.background_color.color }}">
  <div class="trust-badges__grid cols--{{ module.style_fields.columns }}">
    {% for badge in module.badges %}
    <div class="trust-badge">
      <div class="trust-badge__icon">{{ badge.icon }}</div>
      <div class="trust-badge__content">
        <div class="trust-badge__value" style="color: {{ module.style_fields.value_color.color }}">
          {{ badge.value }}
        </div>
        <div class="trust-badge__label">{{ badge.badge_label }}</div>
        {% if badge.sublabel %}
        <div class="trust-badge__sublabel">{{ badge.sublabel }}</div>
        {% endif %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
