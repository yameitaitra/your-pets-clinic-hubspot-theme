<header class="yp-header">
    <div class="yp-header__inner">
      <!-- Logo -->
      <div class="yp-header__logo">
        <a href="/">
          <span class="yp-header__logo-icon">🐾</span>
          <span class="yp-header__logo-text">Yamei Pets Clinic💖</span>
        </a>
      </div>
  
      <!-- Navigation -->
      <nav class="yp-header__nav">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/services">Services</a></li>
          <li><a href="/our-doctors">Our Doctors</a></li>
          <li><a href="/contact">Contact Us</a></li>
          <li><a href="/campaign">Campaign</a></li>
        </ul>
      </nav>
  
      <!-- CTA Button -->
      <div class="yp-header__cta">
        <a href="/contact" class="yp-btn yp-btn--primary">Book Appointment</a>
      </div>
    </div>
  </header>
  
  <style>
    .yp-header {
      background: #ffffff;
      border-bottom: 2px solid #e8f4f0;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .yp-header__inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .yp-header__logo a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .yp-header__logo-icon { font-size: 28px; }
    .yp-header__logo-text {
      font-size: 20px;
      font-weight: 700;
      color: {{ theme.primary_color.color }};
      letter-spacing: -0.3px;
    }
    .yp-header__nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 32px;
    }
    .yp-header__nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.2s;
    }
    .yp-header__nav a:hover { color: {{ theme.primary_color.color }}; }
    .yp-btn--primary {
      background: {{ theme.primary_color.color }};
      color: #fff;
      padding: 10px 22px;
      border-radius: {{ theme.button_border_radius }}px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .yp-btn--primary:hover { background: {{ theme.secondary_color.color }}; }
    </style>
